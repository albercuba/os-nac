[detect]
command:/usr/local/bin/python3.11 /usr/local/opnsense/scripts/Nacmanager/detect.py
parameters:
type:script_output
description:Detect NAC devices from FreeRADIUS logs
message:detecting NAC devices

[detect_scheduled]
command:/usr/local/bin/python3.11 /usr/local/opnsense/scripts/Nacmanager/detect.py
parameters:
type:script_output
description:Scheduled NAC device detection
message:running scheduled NAC device detection

[diagnostics]
command:/usr/local/bin/python3.11 /usr/local/opnsense/scripts/Nacmanager/diagnostics.py
parameters:
type:script_output
description:Show NAC Manager diagnostics
message:showing NAC Manager diagnostics

[status]
command:/usr/local/etc/rc.d/radiusd status; exit 0
parameters:
type:script_output
description:Show FreeRADIUS service status
message:request FreeRADIUS status

[sync]
command:/usr/local/bin/python3.11 /usr/local/opnsense/scripts/Nacmanager/sync_blocked.py
parameters:
type:script_output
description:Synchronize NAC Manager blocked state
message:synchronizing NAC Manager blocked devices
